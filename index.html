<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f2efe7" />
    <meta
      name="description"
      content="将 Markdown 文章一键套用自定义模板，复制到微信公众号后台。"
    />
    <title>排版间 · 微信公众号 Markdown 排版工具</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="noise" aria-hidden="true"></div>
    <header class="topbar">
      <a class="brand" href="#" aria-label="排版间首页">
        <span class="brand-mark" aria-hidden="true">排</span>
        <span>
          <strong>排版间</strong>
          <small>Markdown → WeChat</small>
        </span>
      </a>

      <div class="document-name">
        <span class="status-dot" aria-hidden="true"></span>
        <input id="documentTitle" value="未命名文章" aria-label="文章名称" />
        <span class="saved-label" id="savedLabel">已自动保存</span>
      </div>

      <div class="top-actions">
        <button class="button ghost" id="clearButton" type="button">新文章</button>
        <button class="button primary" id="copyButton" type="button">
          <span>复制到公众号</span>
          <kbd>⌘ ↵</kbd>
        </button>
      </div>
    </header>

    <nav class="mobile-tabs" aria-label="工作区切换">
      <button class="active" data-mobile-view="editor">写作</button>
      <button data-mobile-view="preview">预览</button>
      <button data-mobile-view="style">样式</button>
    </nav>

    <main class="workspace" data-mobile-view="editor">
      <aside class="style-rail panel" aria-label="模板选择">
        <div class="panel-heading">
          <div>
            <span class="eyebrow">STYLE ROOM</span>
            <h2>选择模板</h2>
          </div>
          <span class="count" id="templateCount">03</span>
        </div>

        <div class="template-list" id="templateList"></div>

        <div class="rail-divider"></div>

        <button class="customize-trigger" id="customizeTrigger" type="button">
          <span class="customize-icon" aria-hidden="true">
            <i></i><i></i><i></i>
          </span>
          <span>
            <strong>调整当前模板</strong>
            <small>颜色、字号、圆角与间距</small>
          </span>
          <span aria-hidden="true">↗</span>
        </button>

        <p class="rail-note">
          所有样式都会转换为内联 CSS，复制后不依赖本站。
        </p>
      </aside>

      <section class="editor-panel panel" aria-label="Markdown 编辑器">
        <div class="panel-heading editor-heading">
          <div>
            <span class="eyebrow">MARKDOWN</span>
            <h2>写作区</h2>
          </div>
          <div class="editor-stats">
            <span id="wordCount">0 字</span>
            <span id="readTime">约 1 分钟</span>
          </div>
        </div>

        <div class="toolbar" role="toolbar" aria-label="Markdown 快捷工具">
          <button type="button" data-insert="heading" title="二级标题">H₂</button>
          <button type="button" data-insert="bold" title="加粗"><b>B</b></button>
          <button type="button" data-insert="quote" title="引用">“ ”</button>
          <button type="button" data-insert="link" title="链接">↗</button>
          <button type="button" data-insert="list" title="无序列表">≡</button>
          <button type="button" data-insert="code" title="代码">⌘</button>
          <span class="toolbar-spacer"></span>
          <button type="button" id="downloadButton" title="下载 Markdown">↓ .md</button>
        </div>

        <label class="sr-only" for="markdownInput">Markdown 内容</label>
        <textarea
          id="markdownInput"
          spellcheck="true"
          autocomplete="off"
          aria-describedby="editorHint"
        ></textarea>
        <div class="editor-footer" id="editorHint">
          <span><i class="autosave-pulse"></i> 本地自动保存</span>
          <span>支持标题、列表、引用、链接、图片、代码与表格</span>
        </div>
      </section>

      <section class="preview-panel panel" aria-label="公众号预览">
        <div class="panel-heading preview-heading">
          <div>
            <span class="eyebrow">WECHAT PREVIEW</span>
            <h2>手机预览</h2>
          </div>
          <div class="preview-switch" role="group" aria-label="预览模式">
            <button class="active" data-preview-mode="visual" type="button">预览</button>
            <button data-preview-mode="html" type="button">HTML</button>
          </div>
        </div>

        <div class="preview-stage">
          <div class="phone-ruler" aria-hidden="true">
            <span>0</span><i></i><span>375</span>
          </div>
          <article class="article-preview" id="articlePreview"></article>
          <pre class="html-preview" id="htmlPreview" hidden><code></code></pre>
        </div>
      </section>
    </main>

    <aside class="customizer" id="customizer" aria-hidden="true">
      <div class="customizer-backdrop" data-close-customizer></div>
      <section class="customizer-sheet" role="dialog" aria-modal="true" aria-labelledby="customizerTitle">
        <div class="customizer-header">
          <div>
            <span class="eyebrow">CUSTOM TEMPLATE</span>
            <h2 id="customizerTitle">调出你的版式</h2>
          </div>
          <button class="close-button" data-close-customizer aria-label="关闭" type="button">×</button>
        </div>

        <div class="customizer-body">
          <div class="control-group">
            <span class="control-label">品牌颜色</span>
            <div class="color-row">
              <label>强调色 <input id="accentColor" type="color" /></label>
              <label>文字色 <input id="textColor" type="color" /></label>
              <label>底色 <input id="paperColor" type="color" /></label>
            </div>
          </div>

          <label class="range-control">
            <span><b>正文字号</b><output id="fontSizeOutput">16px</output></span>
            <input id="fontSize" type="range" min="14" max="19" step="1" />
          </label>
          <label class="range-control">
            <span><b>正文行高</b><output id="lineHeightOutput">1.9</output></span>
            <input id="lineHeight" type="range" min="1.5" max="2.3" step="0.1" />
          </label>
          <label class="range-control">
            <span><b>内容留白</b><output id="spacingOutput">24px</output></span>
            <input id="spacing" type="range" min="12" max="36" step="2" />
          </label>
          <label class="range-control">
            <span><b>卡片圆角</b><output id="radiusOutput">8px</output></span>
            <input id="radius" type="range" min="0" max="24" step="2" />
          </label>

          <div class="control-group">
            <span class="control-label">标题造型</span>
            <div class="segmented" id="headingStyle">
              <button data-heading-style="bar" type="button">竖线</button>
              <button data-heading-style="underline" type="button">下划线</button>
              <button data-heading-style="label" type="button">标签</button>
            </div>
          </div>

          <div class="control-group">
            <span class="control-label">字体气质</span>
            <div class="segmented" id="fontFamily">
              <button data-font-family="sans" type="button">现代</button>
              <button data-font-family="serif" type="button">人文</button>
            </div>
          </div>
        </div>

        <div class="customizer-footer">
          <button class="button ghost" id="resetTheme" type="button">恢复模板</button>
          <button class="button primary" id="saveCustomTheme" type="button">保存为我的模板</button>
        </div>
      </section>
    </aside>

    <div class="toast" id="toast" role="status" aria-live="polite">
      <span class="toast-icon">✓</span>
      <span>
        <strong>已复制富文本</strong>
        <small>现在去公众号编辑器粘贴吧</small>
      </span>
    </div>

    <script type="module" src="./app.js"></script>
  </body>
</html>
